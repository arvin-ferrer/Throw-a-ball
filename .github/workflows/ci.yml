name: Quality Gate CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  roblox-and-tooling-gate:
    name: Luau Gate & Tooling Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Rokit and pinned Roblox tools
        run: |
          curl -sSf https://raw.githubusercontent.com/rojo-rbx/rokit/main/scripts/install.sh | bash
          echo "$HOME/.rokit/bin" >> "$GITHUB_PATH"
          "$HOME/.rokit/bin/rokit" install --no-trust-check
        working-directory: game

      - name: Run Roblox quality gate (StyLua, Selene, Lune, Rojo)
        run: python3 scripts/check.py

      - name: Run cross-platform script unit tests
        run: python3 -m unittest discover -s scripts/tests -v
